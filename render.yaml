services:
  - type: web
    name: hkbams-api
    runtime: node
    # IMPORTANT: must be backend so npm install/build run in the API folder
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    # Uses scripts/start.mjs — builds dist if missing, else starts node dist/server.js
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
